<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dan Alves Graduation</title>
<link rel="preload" href="/fonts/SharpEarthMono-Bold.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Sharp Earth Mono Bold is the only font on this site.
     The 100-900 range makes this one file answer every weight request,
     so nothing ever falls through to a second face. */
  @font-face {
    font-family: "Sharp Earth Mono";
    src: url("/fonts/SharpEarthMono-Bold.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }

  * { box-sizing: border-box; }

  html {
    font-family: "Sharp Earth Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-synthesis: none;
  }

  /* Form controls and code elements don't inherit type by default. */
  button, input, select, textarea,
  code, pre, kbd, samp {
    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #000000;
  }

  body {
    padding: 36px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  h1 {
    margin: 0;
    font-size: 12px;
    font-weight: 400;
  }
</style>
</head>
<body>
  <h1>Dan Alves graduation</h1>
</body>
</html>
