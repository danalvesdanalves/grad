<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dan Alves</title>
<link rel="preload" href="/fonts/Alpes-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/SharpSerifText-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/projects/01.png" as="image">
<style>
  /* Two faces, both subset to Latin. Alpes Bold sets the name; Sharp Serif
     Text sets everything else. */
  @font-face {
    font-family: "Alpes";
    src: url("/fonts/Alpes-Bold.woff2") format("woff2");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Sharp Serif Text";
    src: url("/fonts/SharpSerifText-Regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --ink: #A6A6A6;
    --pad: 36px;
    --serif: "Sharp Serif Text", Georgia, "Times New Roman", serif;
    --sans: "Alpes", system-ui, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html {
    font-family: var(--serif);
    font-size: 14px;
    font-synthesis: none;
  }

  button, input, select, textarea,
  code, pre, kbd, samp {
    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: var(--ink);
  }

  body {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Both text blocks float over the feed in opposite corners. They ignore
     pointer events so they can never eat a swipe; only the contact links
     take them back. */
  header, footer {
    position: fixed;
    left: 0;
    padding: var(--pad);
    z-index: 2;
    pointer-events: none;
  }
  header { top: 0; }
  footer { bottom: 0; }

  p { margin: 0; }

  .name {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.015em;
    text-transform: uppercase;
  }

  .contact {
    margin-top: 13px;
  }

  /* The mockup sets every figure as an oldstyle/text figure. */
  .contact, .caption {
    line-height: 1.3;
    font-variant-numeric: oldstyle-nums;
  }

  .contact a {
    color: inherit;
    text-decoration: none;
    pointer-events: auto;
  }

  .feed {
    height: 100%;
    overflow-y: auto;
    overscroll-behavior-y: contain;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
  }
  .feed::-webkit-scrollbar { display: none; }
  .feed:focus-visible { outline: none; }

  /* Exactly one viewport per slide, so every swipe lands cleanly. */
  .slide {
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    scroll-snap-align: start;
    scroll-snap-stop: always;
  }

  /* The square runs edge to edge on whichever axis is shorter and centers on
     the other: full width on a portrait screen, full height on a landscape
     one. Either way it never exceeds the viewport, which is what keeps the
     scroll one-slide-per-swipe. */
  .square {
    position: relative;
    width: min(100%, 100vh);
    width: min(100%, 100dvh);
    aspect-ratio: 1 / 1;
  }

  .square img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    user-select: none;
    -webkit-user-drag: none;
  }
</style>
</head>
<body>
  <header>
    <p class="name">Dan Alves</p>
    <p class="contact">
      <a href="tel:+19736186887">+1 973 618 6887</a><br>
      <a href="mailto:mralvesoffice@gmail.com">mralvesoffice@gmail.com</a>
    </p>
  </header>

  <main class="feed" id="feed" tabindex="0" aria-label="Projects">
    <noscript>
      <div class="slide"><div class="square"><img src="/projects/01.png" alt="Olive — mobile app scanning a product barcode"></div></div>
      <div class="slide"><div class="square"><img src="/projects/02.png" alt="E-commerce storefront on a desktop display"></div></div>
      <div class="slide"><div class="square"><img src="/projects/03.png" alt="Comunal — mobile app landing screen"></div></div>
    </noscript>
  </main>

  <footer>
    <p class="caption" aria-live="polite">
      <span id="caption-title"></span><br>
      <span id="caption-year"></span>
    </p>
  </footer>

<script>
(function () {
  /* PLACEHOLDER COPY — the descriptions and years below are guesses read off
     the images themselves. Replace `caption` and `year` with the real ones. */
  var PROJECTS = [
    { src: "/projects/01.png", caption: "Mobile app for Olive", year: "2026",
      alt: "Olive — mobile app scanning a product barcode" },
    { src: "/projects/02.png", caption: "E-commerce website", year: "2026",
      alt: "E-commerce storefront on a desktop display" },
    { src: "/projects/03.png", caption: "Mobile app for Comunal", year: "2026",
      alt: "Comunal — mobile app landing screen" }
  ];

  var feed = document.getElementById("feed");
  var captionTitle = document.getElementById("caption-title");
  var captionYear = document.getElementById("caption-year");
  var N = PROJECTS.length;
  if (!N) return;

  /* The set is rendered several times over and the scroll position is parked
     in the middle copy. Scrolling off either end lands on identical content,
     so shifting the position back by a whole cycle afterwards is invisible —
     that's the loop. The spare copies are runway: a fling has to outrun two
     full cycles before it can reach a real edge. */
  var COPIES = 5;
  var HOME = Math.floor(COPIES / 2);

  feed.innerHTML = "";
  for (var c = 0; c < COPIES; c++) {
    for (var i = 0; i < N; i++) {
      var slide = document.createElement("div");
      slide.className = "slide";
      var square = document.createElement("div");
      square.className = "square";
      var img = document.createElement("img");
      img.src = PROJECTS[i].src;
      // Only the home copy is exposed to assistive tech; the rest are dupes.
      img.alt = c === HOME ? PROJECTS[i].alt : "";
      if (c !== HOME) square.setAttribute("aria-hidden", "true");
      img.decoding = "async";
      img.draggable = false;
      if (c === HOME && i === 0) img.fetchPriority = "high";
      square.appendChild(img);
      slide.appendChild(square);
      feed.appendChild(slide);
    }
  }

  function slideHeight() {
    return feed.firstElementChild ? feed.firstElementChild.getBoundingClientRect().height : 0;
  }

  function cycle() {
    return slideHeight() * N;
  }

  /* Pull the scroll position back into the home copy. Content repeats every
     cycle, so the shift never shows. */
  function normalize() {
    var C = cycle();
    if (!C) return;
    var base = HOME * C;
    var p = feed.scrollTop;
    var rel = ((p - base) % C + C) % C;
    var target = base + rel;
    if (Math.abs(target - p) > 0.5) feed.scrollTop = target;
  }

  function currentIndex() {
    var h = slideHeight();
    if (!h) return 0;
    return ((Math.round(feed.scrollTop / h) % N) + N) % N;
  }

  /* The caption tracks whichever square is closest to settled, so it flips
     halfway through a swipe rather than waiting for the scroll to stop. */
  var shown = -1;
  function renderCaption() {
    var i = currentIndex();
    if (i === shown) return;
    shown = i;
    captionTitle.textContent = PROJECTS[i].caption;
    captionYear.textContent = PROJECTS[i].year;
  }

  var captionQueued = false;
  function queueCaption() {
    if (captionQueued) return;
    captionQueued = true;
    requestAnimationFrame(function () {
      captionQueued = false;
      renderCaption();
    });
  }

  function goTo(delta) {
    var h = slideHeight();
    if (!h) return;
    feed.scrollTo({ top: Math.round(feed.scrollTop / h) * h + delta * h, behavior: "smooth" });
  }

  // Start on the first project, in the home copy.
  feed.scrollTop = HOME * cycle();
  renderCaption();

  /* Normalizing mid-gesture cancels iOS momentum, so the reposition waits for
     the scroll to settle. */
  var settleTimer;
  if ("onscrollend" in window) {
    feed.addEventListener("scrollend", normalize);
  }
  feed.addEventListener("scroll", function () {
    queueCaption();
    /* Safety net: within half a cycle of a real edge, reposition right away
       rather than risk the scroll dead-ending. Losing momentum beats hitting
       a wall, and this only fires if a fling has outrun the settle handler. */
    var C = cycle();
    if (C) {
      var p = feed.scrollTop;
      if (p < C * 0.5 || p > (COPIES - 0.5) * C) normalize();
    }
    clearTimeout(settleTimer);
    settleTimer = setTimeout(normalize, 140);
  }, { passive: true });

  feed.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
      e.preventDefault(); goTo(1);
    } else if (e.key === "ArrowUp" || e.key === "PageUp") {
      e.preventDefault(); goTo(-1);
    }
  });

  // Keep the same project in view when the square resizes with the window.
  var raf;
  window.addEventListener("resize", function () {
    var idx = currentIndex();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function () {
      var h = slideHeight();
      if (h) feed.scrollTop = HOME * cycle() + idx * h;
    });
  });
})();
</script>
</body>
</html>
