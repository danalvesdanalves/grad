<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dan Alves Graduation</title>
<link rel="preload" href="/fonts/SharpEarthMono-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/projects/01.png" as="image">
<style>
  /* Sharp Earth Mono Bold is the only font on this site.
     The 100-900 range makes this one file answer every weight request,
     so nothing ever falls through to a second face. */
  @font-face {
    font-family: "Sharp Earth Mono";
    src: url("/fonts/SharpEarthMono-Bold.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }

  * { box-sizing: border-box; }

  html {
    font-family: "Sharp Earth Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-synthesis: none;
  }

  /* Form controls and code elements don't inherit type by default. */
  button, input, select, textarea,
  code, pre, kbd, samp {
    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #000000;
  }

  body {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* The name floats above the feed; the 36px belongs to it now, since the
     squares themselves have to run full-bleed. */
  header {
    position: fixed;
    top: 0;
    left: 0;
    padding: 36px;
    z-index: 2;
    pointer-events: none;
  }

  h1 {
    margin: 0;
    font-size: 12px;
    font-weight: 400;
  }

  .feed {
    height: 100%;
    overflow-y: auto;
    overscroll-behavior-y: contain;
    -webkit-overflow-scrolling: touch;
    /* Taller-than-viewport squares (any landscape window) need to be
       scrollable past, so mandatory snapping is portrait-only. */
    scroll-snap-type: y proximity;
    scrollbar-width: none;
  }
  .feed::-webkit-scrollbar { display: none; }
  .feed:focus-visible { outline: none; }

  @media (max-aspect-ratio: 1 / 1) {
    .feed { scroll-snap-type: y mandatory; }
  }

  .slide {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    scroll-snap-align: start;
    scroll-snap-stop: always;
  }

  /* Edge to edge, always square. Height follows the width and is never
     capped to the viewport. */
  .square {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
  }

  .square img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    user-select: none;
    -webkit-user-drag: none;
  }
</style>
</head>
<body>
  <header><h1>Dan Alves graduation</h1></header>

  <main class="feed" id="feed" tabindex="0" aria-label="Projects">
    <noscript>
      <div class="slide"><div class="square"><img src="/projects/01.png" alt="Olive — mobile app scanning a product barcode"></div></div>
      <div class="slide"><div class="square"><img src="/projects/02.png" alt="E-commerce storefront on a desktop display"></div></div>
      <div class="slide"><div class="square"><img src="/projects/03.png" alt="Comunal — mobile app landing screen"></div></div>
    </noscript>
  </main>

<script>
(function () {
  var PROJECTS = [
    { src: "/projects/01.png", alt: "Olive — mobile app scanning a product barcode" },
    { src: "/projects/02.png", alt: "E-commerce storefront on a desktop display" },
    { src: "/projects/03.png", alt: "Comunal — mobile app landing screen" }
  ];

  var feed = document.getElementById("feed");
  var N = PROJECTS.length;
  if (!N) return;

  /* The set is rendered several times over and the scroll position is parked
     in the middle copy. Scrolling off either end lands on identical content,
     so shifting the position back by a whole cycle afterwards is invisible —
     that's the loop. The spare copies are runway: a fling has to outrun two
     full cycles before it can reach a real edge. */
  var COPIES = 5;
  var HOME = Math.floor(COPIES / 2);

  feed.innerHTML = "";
  for (var c = 0; c < COPIES; c++) {
    for (var i = 0; i < N; i++) {
      var slide = document.createElement("div");
      slide.className = "slide";
      var square = document.createElement("div");
      square.className = "square";
      var img = document.createElement("img");
      img.src = PROJECTS[i].src;
      // Only the home copy is exposed to assistive tech; the rest are dupes.
      img.alt = c === HOME ? PROJECTS[i].alt : "";
      if (c !== HOME) square.setAttribute("aria-hidden", "true");
      img.decoding = "async";
      img.draggable = false;
      if (c === HOME && i === 0) img.fetchPriority = "high";
      square.appendChild(img);
      slide.appendChild(square);
      feed.appendChild(slide);
    }
  }

  function slideHeight() {
    return feed.firstElementChild ? feed.firstElementChild.getBoundingClientRect().height : 0;
  }

  function cycle() {
    return slideHeight() * N;
  }

  /* Pull the scroll position back into the home copy. Content repeats every
     cycle, so the shift never shows. */
  function normalize() {
    var C = cycle();
    if (!C) return;
    var base = HOME * C;
    var p = feed.scrollTop;
    var rel = ((p - base) % C + C) % C;
    var target = base + rel;
    if (Math.abs(target - p) > 0.5) feed.scrollTop = target;
  }

  function currentIndex() {
    var h = slideHeight();
    if (!h) return 0;
    return ((Math.round(feed.scrollTop / h) % N) + N) % N;
  }

  function goTo(delta) {
    var h = slideHeight();
    if (!h) return;
    feed.scrollTo({ top: Math.round(feed.scrollTop / h) * h + delta * h, behavior: "smooth" });
  }

  // Start on the first project, in the home copy.
  feed.scrollTop = HOME * cycle();

  /* Normalizing mid-gesture cancels iOS momentum, so the reposition waits for
     the scroll to settle. */
  var settleTimer;
  function onSettle() {
    normalize();
  }
  if ("onscrollend" in window) {
    feed.addEventListener("scrollend", onSettle);
  }
  feed.addEventListener("scroll", function () {
    /* Safety net: within half a cycle of a real edge, reposition right away
       rather than risk the scroll dead-ending. Losing momentum beats hitting
       a wall, and this only fires if a fling has outrun the settle handler. */
    var C = cycle();
    if (C) {
      var p = feed.scrollTop;
      if (p < C * 0.5 || p > (COPIES - 0.5) * C) normalize();
    }
    clearTimeout(settleTimer);
    settleTimer = setTimeout(onSettle, 140);
  }, { passive: true });

  feed.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
      e.preventDefault(); goTo(1);
    } else if (e.key === "ArrowUp" || e.key === "PageUp") {
      e.preventDefault(); goTo(-1);
    }
  });

  // Keep the same project in view when the square resizes with the window.
  var raf;
  window.addEventListener("resize", function () {
    var idx = currentIndex();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function () {
      var h = slideHeight();
      if (h) feed.scrollTop = HOME * cycle() + idx * h;
    });
  });
})();
</script>
</body>
</html>
